{% extends "base.html" %}

{% block title %}Exercise Library - WOPlanner{% endblock %}

{% block content %}
<div>

  <div class="wo-section">
    <div class="wo-flex-between wo-mb-s4">
      <h1 class="wo-title">Exercises</h1>
      <button class="wo-btn wo-btn-inline wo-p-s2" aria-label="Add exercise"
              onclick="document.getElementById('sheet-exercise').showModal()">
        <svg class="wo-icon" aria-hidden="true"><use href="#i-plus"/></svg>
      </button>
    </div>

    <!-- Ziel des HTMX-Swaps: enthält NUR die Liste, sonst würde die
         Überschrift beim Anlegen mit weggetauscht. -->
    <div id="exercise-list">
      {% include "exercises/exercise_list_partial.html" %}
    </div>
  </div>
</div>

<dialog id="sheet-exercise" class="wo-sheet">
  <div class="wo-flex-between wo-mb-s4">
    <h2 class="wo-title">New Exercise</h2>
    <button class="wo-btn wo-btn-inline wo-p-s2" aria-label="Close"
            onclick="this.closest('dialog').close()">&times;</button>
  </div>

  <form hx-post="/exercises"
        hx-target="#exercise-list"
        hx-swap="innerHTML"
        hx-on::after-request="this.reset(); this.closest('dialog').close()">
    <div class="field wo-mb-s4">
      <label for="name" class="wo-label wo-block wo-mb-s2">
        Exercise Name
      </label>
      <input type="text"
             id="name"
             name="name"
             placeholder="e.g. Bench Press, Squat, Deadlift"
             required
             maxlength="100"
             class="wo-input">
    </div>

    <div class="field wo-mb-s4">
      <label for="instructions" class="wo-label wo-block wo-mb-s2">
        Instructions
      </label>
      <textarea
             id="instructions"
             name="instructions"
             rows="4"
             placeholder="Describe proper form and execution..."
             required
             class="wo-input wo-resize-none"></textarea>
    </div>

    <div class="field wo-mb-s4">
      <label for="video_url" class="wo-label wo-block wo-mb-s2">
        Video URL (optional)
      </label>
      <input type="url"
             id="video_url"
             name="video_url"
             placeholder="https://www.youtube.com/watch?v=..."
             class="wo-input">
    </div>

    <button type="submit" class="wo-btn wo-btn-primary">
      Add Exercise
    </button>
  </form>
</dialog>
{% endblock %}
