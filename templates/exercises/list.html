{% extends "base.html" %}

{% block title %}Exercise Library - WOPlanner{% endblock %}

{% block content %}
<div>
  
  <!-- Exercise List Container -->
  <div id="exercise-list" class="wo-section">
    <h1 class="wo-title wo-mb-s4">Exercises</h1>
    {% include "exercises/exercise_list_partial.html" %}
  </div>

  <!-- Add Exercise Container -->
  <div class="wo-section">
    <h2 class="wo-title wo-mb-s4">
      Add New Exercise
    </h2>

    <form hx-post="/exercises"
          hx-target="#exercise-list"
          hx-swap="innerHTML"
          hx-on::after-request="this.reset()">
      <div class="field wo-mb-s4">
        <label for="name" class="wo-label wo-block wo-mb-s2">
          Exercise Name
        </label>
        <input type="text"
               id="name"
               name="name"
               placeholder="e.g. Bench Press, Squat, Deadlift"
               required
               maxlength="100"
               class="wo-input">
      </div>
      
      <div class="field wo-mb-s4">
        <label for="instructions" class="wo-label wo-block wo-mb-s2">
          Instructions
        </label>
        <textarea
               id="instructions"
               name="instructions"
               rows="4"
               placeholder="Describe proper form and execution..."
               required
               class="wo-input wo-resize-none"></textarea>
      </div>

      <div class="field wo-mb-s4">
        <label for="video_url" class="wo-label wo-block wo-mb-s2">
          Video URL (optional)
        </label>
        <input type="url"
               id="video_url"
               name="video_url"
               placeholder="https://www.youtube.com/watch?v=..."
               class="wo-input">
        <p class="wo-label wo-mt-s2">Add a YouTube video link for visual instructions</p>
      </div>

      <button type="submit"
              class="wo-btn wo-btn-primary">
        Add Exercise
      </button>
    </form>
  </div>
</div>
{% endblock %}
