{% extends "base.html" %}

{% block title %}{{ status_code }} - WOPlanner{% endblock %}

{% block content %}
<div class="container is-max-desktop wo-text-center">
  <div class="wo-section wo-p-s6">
    <h1 class="wo-title wo-fs-num-lg wo-color-accent wo-mb-s2">{{ status_code }}</h1>
    <h2 class="wo-title wo-fs-title wo-mb-s3">{{ message }}</h2>
    <p class="wo-label wo-mb-s4">{{ detail }}</p>
    <a href="/dashboard" class="wo-btn wo-btn-primary">
      ← Back to Dashboard
    </a>
  </div>
</div>
{% endblock %}
