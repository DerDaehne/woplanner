{% extends "base.html" %}

{% block title %}Select User - WOPlanner{% endblock %}

{% block content %}
<div>

  <div class="wo-section">
    <div class="wo-flex-between wo-mb-s4">
      <h1 class="wo-title">Who's Training?</h1>
      <button class="wo-btn wo-btn-inline wo-p-s2" aria-label="Add profile"
              onclick="document.getElementById('sheet-user').showModal()">
        <svg class="wo-icon" aria-hidden="true"><use href="#i-plus"/></svg>
      </button>
    </div>

    <!-- Ziel des HTMX-Swaps: enthält NUR die Liste, sonst würde die
         Überschrift beim Anlegen mit weggetauscht. -->
    <div id="user-list">
      {% include "users/user_list_partial.html" %}
    </div>
  </div>

  <!-- Einziger Einstieg zum Abmelden, seit der Knopf aus der Kopfzeile
       verschwunden ist. -->
  {% match current_user %}
    {% when Some with (user) %}
      <form hx-post="/logout" hx-swap="outerHTML" hx-target="body">
        <button type="submit" class="wo-btn">Sign out {{ user.name }}</button>
      </form>
    {% when None %}
  {% endmatch %}
</div>

<dialog id="sheet-user" class="wo-sheet">
  <div class="wo-flex-between wo-mb-s4">
    <h2 class="wo-title">New Profile</h2>
    <button class="wo-btn wo-btn-inline wo-p-s2" aria-label="Close"
            onclick="this.closest('dialog').close()">&times;</button>
  </div>

  <form hx-post="/users"
        hx-target="#user-list"
        hx-swap="innerHTML"
        hx-on::after-request="this.reset(); this.closest('dialog').close()">
    <div class="field wo-mb-s4">
      <label for="name" class="wo-label wo-block wo-mb-s2">
        Full Name
      </label>
      <input type="text"
             id="name"
             name="name"
             placeholder="Enter your name"
             required
             maxlength="100"
             class="wo-input">
    </div>
    <button type="submit" class="wo-btn wo-btn-primary">
      Create Profile
    </button>
  </form>
</dialog>
{% endblock %}
