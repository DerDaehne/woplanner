{% extends "base.html" %}

{% block title %}Select User - WOPlanner{% endblock %}

{% block content %}
<div>
  
  <!-- User List Container -->
  <div id="user-list" class="wo-section">
    <h1 class="wo-title wo-mb-s4">Who's Training?</h1>
    {% include "users/user_list_partial.html" %}
  </div>

  <!-- Add User Container -->
  <div class="wo-section">
    <h2 class="wo-title wo-mb-s4">
      Add New User
    </h2>

    <form hx-post="/users"
          hx-target="#user-list"
          hx-swap="innerHTML"
          hx-on::after-request="this.reset()">
      <div class="field wo-mb-s4">
        <label for="name" class="wo-label wo-block wo-mb-s2">
          Full Name
        </label>
        <input type="text"
               id="name"
               name="name"
               placeholder="Enter your name"
               required
               maxlength="100"
               class="wo-input">
      </div>
      <button type="submit"
              class="wo-btn wo-btn-primary">
        Create Profile
      </button>
    </form>
  </div>
  
  <!-- Motivational Footer -->
  <div class="has-text-centered wo-mt-s6">
    <p class="wo-label">Ready to transform your fitness journey?</p>
  </div>
</div>
{% endblock %}
