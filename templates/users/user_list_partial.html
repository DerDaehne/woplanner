{% if users.len() == 0 %}
  <div class="has-text-centered wo-center-pad">
    <div class="wo-fs-title wo-mb-s4">🏋️</div>
    <p class="wo-color-text-dim-body wo-mb-s2">No users yet!</p>
    <p class="wo-label">Create your first profile below to get started</p>
  </div>
{% else %}
  <div class="wo-cols">
    {% for user in users %}
    <div>
      <button hx-post="/users/{{ user.id }}/select"
              hx-target="#toast-container"
              hx-swap="afterbegin"
              class="wo-btn wo-flex-col-center-gap3-pad5 wo-relative wo-overflow-hidden">
        
        <!-- Content -->
        <div class="is-flex is-flex-direction-column is-align-items-center is-gap-3">
          <!-- User Avatar -->
          <div class="wo-avatar-lg">
            {{ user.name.chars().next().unwrap_or('U') }}
          </div>
          
          <!-- User Name -->
          <div>
            <div class="wo-color-text-bold-body">
              {{ user.name }}
            </div>
            <div class="wo-label">
              Tap to select
            </div>
          </div>
        </div>
      </button>
    </div>
    {% endfor %}
    
    <!-- Add New User Card -->
    <div>
      <div class="wo-border-dashed-line-strong wo-rounded-md wo-text-center-pad5 wo-flex-col-center-gap3 wo-color-text-mute">
        <div class="wo-w-5rem wo-h-5rem wo-rounded-md wo-flex-center wo-fs-title">
          ➕
        </div>
        <div>
          <div class="wo-label">
            Add New User
          </div>
        </div>
      </div>
    </div>
  </div>
{% endif %}
