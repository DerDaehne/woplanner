{% if users.len() == 0 %}
  <div class="wo-empty">
    <p class="wo-color-text-dim wo-fs-body wo-mb-s2">No users yet!</p>
    <p class="wo-label">Create your first profile below to get started</p>
  </div>
{% else %}
  <div>
    {% for user in users %}
      <button hx-post="/users/{{ user.id }}/select"
              hx-target="#toast-container"
              hx-swap="afterbegin"
              class="wo-row wo-row--button">
        <div class="wo-avatar">{{ user.name.chars().next().unwrap_or('U') }}</div>
        <div class="wo-row__main wo-text-left">
          <div class="wo-color-text-bold wo-fs-body wo-truncate">{{ user.name }}</div>
        </div>
        <svg class="wo-icon wo-row__value" aria-hidden="true"><use href="#i-chevron-right"/></svg>
      </button>
    {% endfor %}
  </div>
{% endif %}
