{% if users.len() == 0 %}
  <div class="has-text-centered wo-center-pad">
    <div class="wo-fs-num-lg wo-mb-s4">🏋️</div>
    <p class="wo-color-text-dim-body wo-mb-s2">No users yet!</p>
    <p class="wo-label">Create your first profile below to get started</p>
  </div>
{% else %}
  <div class="columns is-multiline">
    {% for user in users %}
    <div class="column is-one-third-tablet is-one-quarter-desktop">
      <button hx-post="/users/{{ user.id }}/select"
              hx-target="#toast-container"
              hx-swap="afterbegin"
              class="is-fullwidth wo-btn wo-flex-col-center-gap3-pad5 wo-wo-relative wo-overflow-hidden">
        
        <!-- Content -->
        <div class="is-flex is-flex-direction-column is-align-items-center is-gap-3">
          <!-- User Avatar -->
          <div class="is-relative">
            <div class="wo-avatar-lg">
              {{ user.name.chars().next().unwrap_or('U') }}
            </div>
            <!-- Floating badge -->
            <div class="wo-badge">
              <svg class="wo-icon-sm-color" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-8.293l-3-3a1 1 0 00-1.414 1.414L10.586 9.5l-1.293 1.293a1 1 0 101.414 1.414l2-2a1 1 0 000-1.414z" clip-rule="evenodd"></path>
              </svg>
            </div>
          </div>
          
          <!-- User Name -->
          <div>
            <div class="wo-color-text-bold-body">
              {{ user.name }}
            </div>
            <div class="wo-label">
              Tap to select
            </div>
          </div>
        </div>
      </button>
    </div>
    {% endfor %}
    
    <!-- Add New User Card -->
    <div class="column is-one-third-tablet is-one-quarter-desktop">
      <div class="is-fullwidth wo-bg-raised wo-border-dashed-line-strong wo-rounded-md wo-text-center-pad5 wo-flex-col-center-gap3 wo-color-text-mute">
        <div class="wo-w-5rem wo-h-5rem wo-rounded-md wo-flex-center wo-fs-title">
          ➕
        </div>
        <div>
          <div class="wo-label">
            Add New User
          </div>
        </div>
      </div>
    </div>
  </div>
{% endif %}
