{% extends "base.html" %}

{% block title %}Workouts - WOPlanner{% endblock %}

{% block content %}
<div class="container is-max-desktop">
  
  <!-- Hero Section -->
  <div class="wo-section" style="text-align: center;">
    <h1 class="wo-title" style="font-size: var(--wo-fs-num-lg); margin-bottom: var(--wo-s2);">
      Your Workouts
    </h1>
    <p class="wo-meta" style="font-size: var(--wo-fs-body);">Create and manage your training routines</p>
  </div>

  <!-- Workouts List Container -->
  <div id="workout-list" class="wo-section">
    <h2 class="wo-title" style="margin-bottom: var(--wo-s4);">
      🏋️ Available Workouts
    </h2>
    {% include "workouts/workout_list_partial.html" %}
  </div>

  <!-- Create New Workout -->
  <div class="wo-section">
    <h2 class="wo-title" style="margin-bottom: var(--wo-s4);">
      ➕ Create New Workout
    </h2>

    <form hx-post="/workouts"
          hx-target="#workout-list"
          hx-swap="innerHTML"
          hx-on::after-request="this.reset()">
      
      <div class="field" style="margin-bottom: var(--wo-s4);">
        <label for="name" class="wo-label" style="margin-bottom: var(--wo-s2); display: block;">
          Workout Name
        </label>
        <input type="text"
               id="name"
               name="name"
               placeholder="e.g. Push Day, Leg Day, Upper Body"
               required
               maxlength="100"
               class="wo-input">
      </div>
      
      <div class="field" style="margin-bottom: var(--wo-s4);">
        <label for="description" class="wo-label" style="margin-bottom: var(--wo-s2); display: block;">
          Description (optional)
        </label>
        <textarea 
               id="description"
               name="description"
               rows="3"
               placeholder="What muscle groups does this workout target?"
               class="wo-input"
               style="resize: none;"></textarea>
      </div>
      
      <button type="submit"
              class="wo-btn wo-btn-primary">
        🚀 Create Workout
      </button>
    </form>
  </div>
</div>
{% endblock %}
