{% extends "base.html" %}

{% block title %}Workouts - WOPlanner{% endblock %}

{% block content %}
<div class="is-max-desktop" style="max-width: 56rem; margin: 0 auto;">
  
  <!-- Hero Section -->
  <div class="has-text-centered" style="margin-bottom: 2rem;">
    <h1 class="gradient-text" style="font-size: 2.5rem; font-weight: bold; margin-bottom: 1rem;">
      Your Workouts
    </h1>
    <p style="font-size: 1.25rem; color: #b5b5b5;">Create and manage your training routines</p>
  </div>

  <!-- Workouts List Container -->
  <div id="workout-list" class="glass-card" style="border-radius: 1.5rem; padding: 2rem; margin-bottom: 1.5rem;">
    <h2 class="is-size-4 has-text-weight-bold" style="color: #f5f5f5; margin-bottom: 1.5rem;" class="is-flex is-align-center">
      <span style="font-size: 1.75rem; margin-right: 0.75rem;" class="float-element">🏋️</span>
      Available Workouts
    </h2>
    {% include "workouts/workout_list_partial.html" %}
  </div>

  <!-- Create New Workout -->
  <div class="glass-card" style="border-radius: 1.5rem; padding: 2rem;">
    <h2 class="is-size-4 has-text-weight-bold" style="color: #f5f5f5; margin-bottom: 1.5rem;" class="is-flex is-align-center">
      <span style="font-size: 1.75rem; margin-right: 0.75rem;" class="float-element">➕</span>
      Create New Workout
    </h2>

    <form hx-post="/workouts"
          hx-target="#workout-list"
          hx-swap="innerHTML"
          hx-on::after-request="this.reset()"
          style="margin-bottom: 1.5rem;">
      
      <div class="field" style="margin-bottom: 1.5rem;">
        <label for="name" class="label" style="color: #b5b5b5; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.75rem;">
          Workout Name
        </label>
        <input type="text"
               id="name"
               name="name"
               placeholder="e.g. Push Day, Leg Day, Upper Body"
               required
               class="input-glass">
      </div>
      
      <div class="field" style="margin-bottom: 1.5rem;">
        <label for="description" class="label" style="color: #b5b5b5; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.75rem;">
          Description (optional)
        </label>
        <textarea 
               id="description"
               name="description"
               rows="3"
               placeholder="What muscle groups does this workout target?"
               class="input-glass"
               style="resize: none;"></textarea>
      </div>
      
      <button type="submit"
              class="btn-primary is-fullwidth" style="padding: 1rem 1.5rem; font-size: 1rem;">
        <span style="margin-right: 0.5rem;">🚀</span>
        Create Workout
      </button>
    </form>
  </div>
</div>
{% endblock %}
