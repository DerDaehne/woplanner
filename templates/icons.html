<!--

  <svg class="wo-icon"><use href="#i-book"/></svg> benutzt.

  Warum inline und nicht /static/icons.svg: <use href="datei.svg#id"> lädt die
  Datei per Fetch nach. Ältere iOS-Safari-Versionen zeigen dabei nichts an —
  in einer PWA, die genau dort läuft, ist das kein akzeptables Risiko für die
  gesparten 1,5 KB.

  Alle Symbole: 24x24, fill none, stroke currentColor. Dadurch erben sie
  Textfarbe und Dock-Aktivzustand ohne eine einzige Extraregel.
-->
